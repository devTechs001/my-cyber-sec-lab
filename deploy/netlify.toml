# Netlify configuration for the React client (client/).
# Deploy: Netlify UI → "Add new site → Import from Git" → set Base directory = client,
# Build command = npm run build, Publish directory = client/dist
# (or keep this file at repo root and set base = "client").

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# SPA fallback — React Router handles /lessons, /labs/... client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API calls to the Render backend so the site works on one domain.
# Set the environment variable RENDER_API_URL in Netlify (Site settings → Environment).
[[redirects]]
  from = "/api/*"
  to = "https://cyber-ec-lab-api.onrender.com/api/:splat"
  status = 200
  force = true
